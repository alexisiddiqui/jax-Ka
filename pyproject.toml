[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-propka"
version = "0.1.0"
description = "Frozen-structure, soft-sequence titration model with Biotite topology and JAX differentiation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "scipy>=1.11", "jax>=0.4.35,<0.12", "biotite>=1.4,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
reference = ["propka==3.5.1"]
benchmark = ["pyarrow>=20,<21"]
solver = ["optimistix>=0.0.10", "lineax>=0.0.7", "equinox>=0.11"]
train = ["optimistix>=0.0.10", "lineax>=0.0.7", "equinox>=0.11", "optax>=0.2.5", "pyarrow>=20", "filelock>=3.16"]
mps = [
  "jax==0.11.1; python_version >= '3.12'",
  "jaxlib==0.11.1; python_version >= '3.12'",
  "jax-mps==0.11.0; python_version >= '3.12'",
]

[project.scripts]
jaxpropka = "jaxpropka.cli:main"
pkabench = "pkabench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires Biotite and structure I/O",
  "reference: requires an installed external PROPKA implementation",
  "mps: requires the jax-mps backend on Apple Silicon",
]
